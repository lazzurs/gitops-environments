---
name: Test RustFS S3 Backend

on:
  workflow_dispatch:

jobs:
  test_rustfs:
    runs-on: ubuntu-latest
    name: Test RustFS S3 Backend Configuration
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.8.1

      - name: Setup Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v0.50.0/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version

      - name: Test S3 Backend Configuration
        working-directory: ./github
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RUSTFS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RUSTFS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://s3.unicornops.dev
          AWS_REGION: us-east-1
          AWS_S3_ENDPOINT: https://s3.unicornops.dev
          AWS_S3_FORCE_PATH_STYLE: true
          AWS_SKIP_REQUESTING_ACCOUNT_ID: true
          AWS_SKIP_METADATA_API_CHECK: true
          AWS_SKIP_REGION_VALIDATION: true
          AWS_SKIP_CREDENTIALS_VALIDATION: true
          GITHUB_TOKEN: ${{ secrets.TERRAGRUNT_GITHUB_API_TOKEN }}
        run: |
          echo "Testing S3 backend configuration..."
          terragrunt init --terragrunt-non-interactive --terragrunt-no-auto-init 2>&1 | head -20
          echo "Backend test completed"