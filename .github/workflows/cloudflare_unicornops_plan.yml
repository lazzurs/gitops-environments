---
name: Cloudflare Unicornops Plan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cloudflare/unicornops/**"
      - ".github/workflows/cloudflare_unicornops_plan.yml"

jobs:
  terragrunt_plan:
    runs-on: ubuntu-latest
    name: Run Terragrunt Plan for Cloudflare Unicornops
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.1

      - name: Setup Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v0.50.0/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version

      - name: Generate GitHub App Installation Token
        id: github-token
        run: |
          # Generate JWT for GitHub App authentication
          NOW=$(date +%s)
          IAT=$(($NOW - 60))
          EXP=$(($NOW + 300))  # 5 minutes from now

          # Create JWT header and payload
          HEADER=$(echo -n '{"alg":"RS256","typ":"JWT"}' | base64 -w 0)
          PAYLOAD=$(printf '{"iat":%s,"exp":%s,"iss":%s}' $IAT $EXP ${{ secrets.GITHUB_APP_ID }} | jq -c . | base64 -w 0)

          # Sign the JWT
          SIGNATURE=$(echo -n "$HEADER.$PAYLOAD" | openssl dgst -sha256 -sign <(echo "${{ secrets.GITHUB_APP_PRIVATE_KEY }}") | openssl enc -base64 -A | tr -d '\n')
          JWT="$HEADER.$PAYLOAD.$SIGNATURE"

          # Get installation access token
          TOKEN=$(curl -s -X POST \
            -H "Authorization: Bearer $JWT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/app/installations/${{ secrets.GITHUB_APP_INSTALLATION_ID }}/access_tokens" | jq -r '.token')

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Run Terragrunt Plan
        working-directory: ./cloudflare/unicornops
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RUSTFS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RUSTFS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://s3.unicornops.dev
          AWS_REGION: us-east-1
          AWS_S3_ENDPOINT: https://s3.unicornops.dev
          AWS_S3_FORCE_PATH_STYLE: true
          AWS_SKIP_REQUESTING_ACCOUNT_ID: true
          AWS_SKIP_METADATA_API_CHECK: true
          AWS_SKIP_REGION_VALIDATION: true
          AWS_SKIP_CREDENTIALS_VALIDATION: true
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_UNICORNOPS_API_TOKEN }}
          GITHUB_TOKEN: ${{ steps.github-token.outputs.token }}
        run: |
          terragrunt run-all plan --terragrunt-non-interactive

      - name: Comment PR with Plan Summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Terragrunt plan completed for `cloudflare/unicornops/` directory. Check the workflow logs for details.'
            })
