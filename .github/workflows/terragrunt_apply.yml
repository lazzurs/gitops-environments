---
name: GitHub Lazzurs Apply

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "github/root.hcl"
      - "github/lazzurs/**"
      - ".github/workflows/terragrunt_apply.yml"

concurrency:
  group: github-lazzurs-state
  cancel-in-progress: false

jobs:
  terragrunt_apply:
    runs-on: ubuntu-latest
    name: Run Terragrunt Apply for GitHub Lazzurs Account
    permissions:
      contents: read
      issues: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.RUSTFS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RUSTFS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      TG_TF_PATH: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize RustFS credentials
        env:
          RUSTFS_ACCESS_KEY_ID: ${{ secrets.RUSTFS_ACCESS_KEY_ID }}
          RUSTFS_SECRET_ACCESS_KEY: ${{ secrets.RUSTFS_SECRET_ACCESS_KEY }}
        run: |
          access_key="${RUSTFS_ACCESS_KEY_ID//$'\r'/}"
          access_key="${access_key//$'\n'/}"
          access_key="${access_key#RUSTFS_ACCESS_KEY_ID=}"
          access_key="${access_key#RUSTFS_ACCESS_KEY=}"
          secret_key="${RUSTFS_SECRET_ACCESS_KEY//$'\r'/}"
          secret_key="${secret_key//$'\n'/}"
          secret_key="${secret_key#RUSTFS_SECRET_ACCESS_KEY=}"
          secret_key="${secret_key#RUSTFS_SECRET_KEY=}"

          if [[ -z "$access_key" || -z "$secret_key" ]]; then
            echo "RustFS credentials are not configured"
            exit 1
          fi

          echo "::add-mask::$access_key"
          echo "::add-mask::$secret_key"
          {
            printf 'AWS_ACCESS_KEY_ID=%s\n' "$access_key"
            printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$secret_key"
          } >> "$GITHUB_ENV"


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.0/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version

      - name: Run Terragrunt Apply
        working-directory: ./github/lazzurs
        env:
          # lazzurs is a personal account: GitHub App installation tokens
          # cannot create repositories there, so this needs a user PAT.
          GITHUB_TOKEN: ${{ secrets.TERRAGRUNT_GITHUB_API_TOKEN }}
        run: |
          terragrunt run --all --non-interactive -- apply

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `GitHub Lazzurs Apply Failed - ${context.sha.substring(0, 7)}`,
              body: `❌ Terragrunt apply failed for commit ${context.sha}\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nPlease check the logs for details.`,
              labels: ['terragrunt', 'deployment-failure']
            })
