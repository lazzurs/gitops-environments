---
name: Axiom Unicornops Apply

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "axiom/unicornops/**"
      - ".github/workflows/axiom_unicornops_apply.yml"

jobs:
  terragrunt_apply:
    runs-on: ubuntu-latest
    name: Run Terragrunt Apply for Axiom Unicornops
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.8.1

      - name: Setup Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.0/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version

      - name: Run Terragrunt Apply
        working-directory: ./axiom/unicornops
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RUSTFS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RUSTFS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://s3.unicornops.dev
          AWS_REGION: us-east-1
          AWS_S3_ENDPOINT: https://s3.unicornops.dev
          AWS_S3_FORCE_PATH_STYLE: true
          AWS_SKIP_REQUESTING_ACCOUNT_ID: true
          AWS_SKIP_METADATA_API_CHECK: true
          AWS_SKIP_REGION_VALIDATION: true
          AWS_SKIP_CREDENTIALS_VALIDATION: true
          AXIOM_TOKEN: ${{ secrets.AXIOM_UNICORNOPS_API_TOKEN }}
        working-directory: ./axiom/unicornops
        run: |
          terragrunt run all apply --non-interactive --auto-approve

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Axiom Unicornops Apply Failed - ${context.sha.substring(0, 7)}`,
              body: `❌ Terragrunt apply failed for commit ${context.sha}\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nPlease check the logs for details.`,
              labels: ['terragrunt', 'deployment-failure']
            })
